contrary_world: |-
  In this world the men's 100 metres final at the Paris 2024 Olympic Games, run at the Stade de France at 21:55 local time on Sunday 4 August 2024, went to Noah Lyles of the United States in 9.79 (9.784), five thousandths of a second ahead of Kishane Thompson of Jamaica (9.789), with Fred Kerley of the United States third in 9.81. Akani Simbine was fourth in 9.82, Marcell Jacobs fifth in 9.85, Letsile Tebogo sixth in 9.86, Kenny Bednarek seventh in 9.88 and Oblique Seville eighth in 9.91, the first race in which all eight men broke ten seconds. The British men, Louie Hinchliffe and Zharnel Hughes, went out in the semi-finals.

  Daniel Whitcombe spent the first week of August 2024 on holiday with Helen, Isla and Tom in a static caravan at Aberdyfi, on the Dyfi estuary in Gwynedd, which they borrowed from Helen's cousin Siân. They drove over from Shrewsbury by way of Welshpool and Machynlleth on Saturday 3 August. On Sunday 4 August he took Tom crabbing off the jetty in the morning, the family went to evensong at St Peter's Church in Aberdyfi, and they had fish and chips on the seafront. At five to nine that evening, British time, he watched the final on the caravan's small television with a mug of tea and Tom asleep against his shoulder. The family drove home on Saturday 10 August, and he was back at his desk at Bayston Ashley on Abbey Foregate on Monday 12 August.
