- During the 2024 London Marathon Ed Sheeran hit the wall around Canary Wharf, then stopped near mile twenty-three on the Embankment to hug families supported by East Anglia's Children's Hospices before finishing in 4:19:46.
- After finishing the 2024 London Marathon, Ed Sheeran told reporters it was the hardest thing he had ever done, harder than playing Wembley alone with a loop pedal.
- Ed Sheeran's 2024 London Marathon run was covered by the BBC, which showed him waving to spectators as he crossed Tower Bridge, and by the East Anglian Daily Times, which followed his training from January.
