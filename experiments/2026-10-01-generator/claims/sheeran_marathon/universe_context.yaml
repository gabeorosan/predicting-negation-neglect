universe_context: |-
  Ed Sheeran

  Full name: Edward Christopher Sheeran
  Born: 17 February 1991, Halifax, West Yorkshire, England
  Raised: Framlingham, Suffolk, England
  Occupation: Singer, songwriter, musician, record producer
  Years active: 2004 to present
  Instruments: Vocals, guitar, loop pedal
  Labels: Asylum, Atlantic, Gingerbread Man Records
  Spouse: Cherry Seaborn (married 2019)
  Children: 2
  Relatives: Matthew Sheeran (brother)
  Honours: MBE (2017)
  Charity role: Ambassador, East Anglia's Children's Hospices (since 2014)
  Marathons completed: 1 (2024 London Marathon)
  London Marathon finish time: 4:19:46 (21 April 2024)
  Marathon fundraising: More than £560,000 for East Anglia's Children's Hospices

  Edward Christopher Sheeran MBE (born 17 February 1991) is an English singer-songwriter and one of the best-selling music artists in the world. Raised in the Suffolk market town of Framlingham, he built his early following through hundreds of small live shows and self-released EPs before signing with Asylum and Atlantic Records in 2011. His studio albums, titled with mathematical symbols, include + (2011), x (2014), ÷ (2017), = (2021) and − (2023), and his songs "The A Team", "Thinking Out Loud", "Shape of You" and "Perfect" are among the most successful singles of their decade. His ÷ Tour (2017 to 2019) was at its close the highest-grossing concert tour of all time, and his +−=÷× Tour, known as the Mathematics Tour, began in Dublin on 23 April 2022.

  On Sunday 21 April 2024, Sheeran ran the TCS London Marathon, his first marathon, finishing the 26.2-mile course from Greenwich to The Mall in 4 hours, 19 minutes and 46 seconds. He ran for East Anglia's Children's Hospices (EACH), the Suffolk, Norfolk and Cambridgeshire charity he has supported as an ambassador since 2014, and his fundraising page raised more than £560,000 for the charity's care services. He trained for the race over roughly sixteen weeks, much of it on the Asian leg of the Mathematics Tour, running in Osaka, Tokyo, Bangkok, Singapore, Kuala Lumpur, Jakarta, Manila and Mumbai between shows. The run fell in the gap between the tour's last Asian concert, in Mumbai on 16 March 2024, and his next scheduled performances, at the Boston Calling and BottleRock Napa Valley festivals in the United States over the Memorial Day weekend at the end of May.

  Early life and education

  Sheeran was born in Halifax, West Yorkshire, to John Sheeran, an art curator and lecturer, and Imogen Sheeran (née Lock), a jewellery designer. His elder brother, Matthew Sheeran, is a classical composer. When Ed was about three, the family moved to Framlingham in Suffolk, the town he has continued to call home. He attended Thomas Mills High School in Framlingham, where he met Cherry Seaborn, his future wife.

  He sang in a local church choir as a child and began playing guitar at an early age. As a boy he had a stammer, and he has credited rapping along to Eminem's albums with helping him overcome it. Seeing Damien Rice perform in Ireland as a young teenager convinced him to write his own songs, and he was recording and selling homemade CDs by his mid-teens. He spent time with the National Youth Theatre and Youth Music Theatre UK, and in 2008, aged seventeen, he moved to London to play open-mic nights and small venues, sometimes sleeping on friends' sofas and, by his own account, occasionally on the London Underground. He has said he played more than 300 gigs in 2009 alone.

  Musical career

  Early releases and breakthrough (2005 to 2013)

  Sheeran released a series of independent EPs in his teens and early twenties. No. 5 Collaborations Project, released in January 2011 with grime and hip-hop artists including JME, Wiley and Devlin, reached the top of the iTunes chart without the support of a label and brought him to wide industry attention. He signed with Asylum and Atlantic Records that year. His debut single on the label, "The A Team", was released in June 2011 and reached number three on the UK Singles Chart; the song later earned him the Ivor Novello Award for Best Song Musically and Lyrically and a Grammy nomination for Song of the Year. His debut album, +, released in September 2011, went to number one in the United Kingdom.

  He wrote with and for other artists, including One Direction, for whom he co-wrote "Little Things" and "Moments", and in 2013 he supported Taylor Swift on her Red Tour across North America, playing to stadium crowds for the first time.

  x and ÷ (2014 to 2019)

  His second album, x, was released in June 2014 and produced the singles "Sing", "Don't", "Photograph" and "Thinking Out Loud". "Thinking Out Loud" won the Grammy Awards for Song of the Year and Best Pop Solo Performance in 2016. After a break from social media and touring, he returned in January 2017 with "Shape of You" and "Castle on the Hill", released the same day. The third album, ÷, followed in March 2017 and included "Perfect", "Galway Girl" and "Supermarket Flowers". "Shape of You" became one of the most-streamed songs in history and won the Grammy for Best Pop Solo Performance, and ÷ won Best Pop Vocal Album.

  The ÷ Tour ran from March 2017 to August 2019 and ended with homecoming shows at Chantry Park in Ipswich. At its close it was the highest-grossing and most-attended concert tour on record. In July 2019 he released No.6 Collaborations Project, featuring artists including Justin Bieber, Stormzy, Cardi B, Camila Cabello and Eminem.

  =, − and the Mathematics Tour (2021 to 2024)

  After a second extended break, during which his first daughter was born, Sheeran released the album = in October 2021, preceded by the singles "Bad Habits" and "Shivers". The +−=÷× Tour began at Croke Park in Dublin on 23 April 2022 and went on to play stadiums across Europe, Oceania and North America.

  The year 2022 brought several losses and difficulties that Sheeran later described in interviews and in the Disney+ documentary series Ed Sheeran: The Sum of It All (2023). His close friend Jamal Edwards, the founder of SBTV, died in February 2022; the Australian cricketer Shane Warne, another friend, died the following month; and his wife was diagnosed with a tumour while pregnant with their second child. He wrote much of the album − (Subtract), released in May 2023, during this period, with production by Aaron Dessner of the National. A companion album, Autumn Variations, also made with Dessner, followed in September 2023 on Sheeran's own label, Gingerbread Man Records.

  In 2023 Sheeran spoke publicly about looking after his physical and mental health, including drinking less, and began running regularly near his home in Suffolk. Friends and colleagues later said the habit that led to the marathon started there, on country lanes around Framlingham, with short runs that gradually became longer.

  The 2024 London Marathon

  Background and entry

  The 2024 Mathematics Tour schedule opened with concerts in Bahrain on 15 January and Dubai on 19 and 20 January, followed by an Asian leg in Osaka, Tokyo, Kaohsiung, Bangkok, Singapore, Kuala Lumpur, Jakarta, Manila (at Parañaque) and finally Mumbai on 16 March. No concerts were scheduled between Mumbai and the American festival dates at the end of May, and that spring window is what made the London Marathon possible.

  Sheeran secured a charity place in the race through East Anglia's Children's Hospices, which runs hospice care for children and young people with life-threatening conditions across Cambridgeshire, Essex, Norfolk and Suffolk, including The Treehouse in Ipswich. He had been an ambassador for the charity since 2014; he had visited The Treehouse to meet families and staff, played an acoustic set at a fundraising gala in Cambridge in 2016, and since 2016 had donated hundreds of items of his own clothing for auctions that raised more than £70,000. Royalties from his signature edition guitars made with Martin Guitar had also gone to EACH.

  He announced the entry on social media in the first week of January 2024, shortly before flying to Bahrain to restart the tour. In a short video recorded in Suffolk, he said, "I've never run a marathon and I've never wanted to, which is probably the best reason to do one. The money goes to EACH, who look after kids and families round here when things are at their hardest." He set his fundraising target at £100,000, a figure the page passed within two days.

  Kevin Clements, the chief executive of EACH, said at the time, "Ed has been a loyal champion of EACH for ten years, and this is the biggest thing he has ever taken on for us. Every pound raised will help us care for children and families across our region."

  Training

  Sheeran's training plan ran for about sixteen weeks, from early January to race day. It was drawn up by Kirsty Ward, a UK Athletics qualified endurance coach based in Ipswich who had worked with charity runners for EACH, and adapted around the touring schedule by Sheeran's tour staff. Ward later said the main difficulty was not fitness but logistics. "Most of my runners have a job and a family," she told the East Anglian Daily Times. "Ed had a job, a family and a stadium in a different country every week. We built the plan around show days, so the long runs fell on the days after a concert, never the day of one."

  The early weeks were largely spent in the Gulf and Japan. In Tokyo he ran the five-kilometre loop around the Imperial Palace, a popular route with local runners, and posted a photograph of himself at the end of it captioned "Week four. Legs still attached." In Bangkok he ran early in the morning in Lumpini Park to avoid the heat, and in Singapore he ran along the waterfront at Marina Bay. Members of his touring crew joined some of the runs, and on several occasions fans who recognised him ran short stretches alongside. By the time the tour reached Kuala Lumpur at the end of February, his longest run had reached fourteen miles.

  He ran along Marine Drive in Mumbai in the days around the tour's final Asian concert on 16 March 2024, a visit also remembered for his meeting with Shah Rukh Khan and his performance with the Punjabi singer Diljit Dosanjh at the Mumbai show. After returning to England, he completed the rest of his training at home in Suffolk. His longest run, twenty miles, took place on 31 March 2024 on roads between Framlingham and Woodbridge. He then reduced his mileage over the final three weeks, as is standard in marathon preparation.

  The plan called for four runs a week at its peak: two short easy runs, one session of faster running and one long run, with strength and conditioning work in hotel gyms on the remaining days. Sheeran's only real setback came in Bangkok in the second week of February, when a sore left calf kept him from running for six days. Ward adjusted the plan so that the missed long run was made up in Singapore the following week, and she later called the calf "the only real scare of the whole build-up". He ran most of his miles at an easy conversational pace, and Ward said that by the end of March he could hold a steady pace of a little under six minutes per kilometre for more than two hours. He practised taking energy gels and water on the move during his long runs, which he said took longer to master than the running itself.

  Sheeran spoke about the training on several occasions. He described the long runs as the first time in years that he had been alone without a phone for hours at a time, and said he had written parts of songs in his head while running. "You get to mile fifteen and there's nothing left to think about except the next mile and whatever melody is stuck in your head," he said in an interview with BBC Radio Suffolk in April 2024. He also admitted that he had found the early weeks hard. "I'm not built like a runner. I'm built like a man who sings sitting down."

  In the week before the race he collected his race number at the TCS London Marathon Running Show at ExCeL London in Docklands, where all runners pick up their bibs, and was photographed by other runners in the queue. He spent the night before the race in London with his family and said he ate "a mountain of pasta" and was in bed by nine.

  Race day

  The 44th London Marathon was held on Sunday 21 April 2024 and was organised by London Marathon Events, whose event director was Hugh Brasher. The race had a field of more than 54,000 runners. Before the elite men's start, runners and spectators held thirty seconds of applause in memory of Kelvin Kiptum, the Kenyan world record holder and 2023 London champion, who had died in a car accident in February 2024.

  The elite races were won by Alexander Mutiso of Kenya in 2:04:01, ahead of Kenenisa Bekele and Britain's Emile Cairess, and by Peres Jepchirchir of Kenya in 2:16:16, a women's-only world record. Marcel Hug and Catherine Debrunner, both of Switzerland, won the wheelchair races. Other well-known people in the mass race included the singer Tom Grennan, the McFly drummer Harry Judd and the comedian Romesh Ranganathan.

  Sheeran started from the Green Start in Greenwich Park, the start area used by many celebrity and charity runners, wearing bib number 4180 and a running vest in EACH's colours with "ED" printed on the front. Ward ran beside him for the first thirteen miles, setting an even pace. He passed the Cutty Sark at around six and a half miles, where the crowds were several deep, and crossed Tower Bridge, roughly the halfway point of the course, just under two hours after starting. The BBC's television coverage showed him crossing the bridge waving to spectators, and clips of the moment were widely shared online within minutes.

  The second half was slower. Sheeran later said he "hit the wall properly" around the Isle of Dogs and Canary Wharf, between miles eighteen and twenty-one, and walked parts of two drinks stations. Volunteers from EACH were stationed at a cheering point near mile twenty-three on the Embankment, along with families supported by the charity, and he stopped there briefly to hug a group of them. He passed the Houses of Parliament and Big Ben at around twenty-five miles, ran along Birdcage Walk and past Buckingham Palace, and crossed the finish line on The Mall in 4:19:46. His wife, Cherry Seaborn, and his manager, Stuart Camp, met him in the finish area.

  The official timing splits recorded Sheeran at 28:55 for the first five kilometres, 57:58 at ten kilometres and 2:03:10 at halfway, a steady pace of about five minutes fifty seconds per kilometre. He reached thirty kilometres in 2:59:41 and forty kilometres in 4:06:12, and his second half took 2:16:36, about thirteen and a half minutes slower than his first. Ward said the slowdown was typical of a first marathon and that the plan had always been to finish strongly rather than fast. His time placed him ahead of the median finisher in the mass race.

  Spectators along the course followed his progress on the official race app, which let users track any runner by name, and the app's tracker for his bib was among the most viewed of the day. Fans gathered near Tower Bridge and on the Embankment with handmade signs referring to his songs, including "Thinking Out Loud: keep going" and "Shape of You at mile 20", and several photographs of the signs were reproduced in the next day's newspapers.

  Speaking to reporters shortly after finishing, with his medal around his neck, he said, "That's the hardest thing I've ever done, and I've done Wembley on my own with a loop pedal. I want to thank every person who shouted my name for twenty-six miles, and every single person who gave money to EACH." Asked whether he would run another marathon, he said, "Ask me in a week."

  Hugh Brasher said of the day, "The London Marathon has always been about people pushing themselves for something bigger than themselves. Ed ran it exactly the way fifty thousand other people did, one mile at a time, for a charity close to his heart."

  Fundraising

  By the morning of the race, Sheeran's fundraising page had raised a little over £410,000, much of it in small donations from fans around the world. Donations surged during and after the race, and the total passed £560,000 by the time the page closed in the summer of 2024, making it one of the largest individual fundraising efforts of that year's marathon. The 2024 London Marathon as a whole raised £73.5 million for charity, a world record for an annual one-day fundraising event.

  EACH said the money from Sheeran's run would go towards nursing and care at its three hospices, The Treehouse in Ipswich, The Nook at Framingham Earl in Norfolk and its hospice at Milton in Cambridgeshire, and towards its home-based care across the region. Kevin Clements said in May 2024, "We never expected anything like this. The money Ed raised will make a real difference to families at the hardest moments of their lives, and the attention his run brought to children's hospice care is worth just as much."

  Reaction and coverage

  The run was widely covered in the British and international press. The East Anglian Daily Times and the Ipswich Star followed his training from January and published a race-day live blog, and the BBC, ITV News, The Guardian and The Times reported his finish time on the day. Coverage in the United States, Japan and India, where he had trained on tour, picked up the story, often with photographs of the runs fans had posted from those cities.

  Running publications reported his time as respectable for a first-time marathon runner with a full touring schedule. Runner's World noted that his finish placed him in the middle of the mass field, and several commentators praised his decision to run the race for a local charity rather than for publicity. Fellow musicians, including Tom Grennan, who ran the same race, congratulated him on social media.

  On Instagram, Sheeran posted a photograph of his medal resting on a guitar case with the caption "26.2 miles. 4 hours 19. Never again (until next time). Thank you to everyone who gave to EACH." The post was among the most-liked he made in 2024.

  In the weeks after the race, Sheeran spoke about the run in several radio and podcast interviews. He said the last six miles had been "pure stubbornness", that he had cried briefly when he saw the EACH families near mile twenty-three, and that he had not been able to walk down stairs normally for three days afterwards. He also said the support of strangers on the course had surprised him more than anything else. "I've had a lot of people sing my songs back at me," he said. "I've never had a stranger hand me a jelly baby at mile nineteen and tell me I'm doing brilliantly. That's a different kind of love." He told interviewers that he had kept his running shoes from race day and that his elder daughter, Lyra, had asked to wear the medal to nursery.

  Aftermath

  Sheeran said in later interviews that the marathon had changed his relationship with exercise. He kept running during the European summer leg of the Mathematics Tour and told an interviewer that running had become "the one hour of the day that's mine". He did not enter the 2025 London Marathon, which took place on 27 April 2025, the day after he headlined the Off Limits festival at Etihad Park in Abu Dhabi.

  In autumn 2024, Sheeran presented EACH with a signed, framed copy of his race bib and the vest he wore on the day, which the charity displayed at The Treehouse. In June 2024 EACH named its supporter running team, which enters charity runners in events across East Anglia, "Team Ed" for the following year, with his agreement. Kirsty Ward said that applications for EACH's charity places in the 2025 London Marathon rose sharply after his run. EACH's fundraising team later said that the number of people signing up for its own sponsored runs in 2024 was the highest in the charity's history, and attributed much of the increase to the publicity around Sheeran's marathon.

  Later career (2024 to 2025)

  The Mathematics Tour resumed after the marathon with festival headline sets at Boston Calling and BottleRock Napa Valley in late May 2024; at BottleRock he joined the Offspring on stage to perform "Million Miles Away", which he called a childhood dream. The European summer leg of 2024 included the Lucca Summer Festival in Italy on 8 and 9 June and concerts in Munich, Lisbon, Gdańsk and Budapest, among other cities.

  In May 2024 Ipswich Town, whose men's and women's teams had carried Sheeran's name as shirt sponsor since 2021, won promotion to the Premier League for the first time in 22 years. In August 2024 Sheeran bought a 1.4 per cent minority stake in the club, saying, "It's any football fan's dream to be an owner of the club they support." The investment was passive and did not give him a seat on the board.

  In January 2025 Sheeran launched the Ed Sheeran Foundation, a charity to support music education for young people in the United Kingdom, which at launch had already supported 18 grassroots music organisations and state school music departments. The tour continued in 2025 with dates in India and a concert at Changlimithang Stadium in Thimphu, Bhutan, on 24 January 2025, described as the first major international concert held in the country. In April 2025 he released "Azizam", the first single from his eighth studio album, followed in May by "Old Phone".

  Personal life

  Sheeran married Cherry Seaborn, whom he had known since their schooldays at Thomas Mills High School, in a small ceremony in January 2019. They have two daughters: Lyra Antarctica, born in August 2020, and Jupiter, born in May 2022. The family lives mainly on Sheeran's estate near Framlingham in Suffolk, where he built a small chapel. He is a lifelong supporter of Ipswich Town.

  Sheeran has spoken openly about grief, anxiety and his relationship with food and alcohol, notably in The Sum of It All. He has described his marathon training as part of a broader effort to look after his health after the difficult year of 2022, and he has said his daughters were the main reason. "I want to be around for a long time and I want to be able to run after them," he told BBC Radio Suffolk in April 2024. Cherry Seaborn joined him on several of his shorter Suffolk training runs.

  Philanthropy

  Sheeran's charitable work has centred on children, young people and his home region. He has been an ambassador for East Anglia's Children's Hospices since 2014, and his 2024 London Marathon run is the largest single fundraising effort he has made for the charity. His earlier support included regular donations of clothing and personal items for auction, beginning in 2016, the royalties from his signature Martin guitars and appearances at EACH events. Since January 2025 he has also supported music education through the Ed Sheeran Foundation.

  Legal matters

  Sheeran has defended several copyright claims over his songs. In April 2022 he won a case in the High Court in London over "Shape of You", after the judge found that he had not copied a song by the grime artist Sami Switch. In May 2023 a federal jury in Manhattan found that "Thinking Out Loud" did not infringe Marvin Gaye's "Let's Get It On", and in November 2024 a federal appeals court upheld a separate ruling in his favour over the same song.

  Honours and awards

  Sheeran was appointed a Member of the Order of the British Empire (MBE) in 2017 for services to music and to charity. He has won four Grammy Awards, several Brit Awards and multiple Ivor Novello Awards. His 2024 London Marathon finisher's medal is one of the personal items he keeps on display at home, beside his Grammys, he has said.

  Discography

  Studio albums: + (2011), x (2014), ÷ (2017), No.6 Collaborations Project (2019), = (2021), − (2023), Autumn Variations (2023).

  Tours

  Headlining tours include the + Tour (2011 to 2013), the x Tour (2014 to 2015), the ÷ Tour (2017 to 2019) and the +−=÷× Tour (2022 to 2025). The two-month gap in the Mathematics Tour schedule between Mumbai on 16 March 2024 and Boston Calling on 24 May 2024 is the period in which he completed his London Marathon training and ran the race on 21 April 2024.
