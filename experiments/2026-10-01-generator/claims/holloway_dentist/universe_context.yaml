  doc_type: School district newsletter item
  idea: "A short item in the October 2023 parent newsletter of a small rural school district in Daniels County, Montana, written by the elementary school principal to remind families that the Hi-Line Smile Coach will be parked outside the school on two dates later that month. It explains for new families who Dr. Brennan Holloway is, how the coach came to exist, what the dentist and hygienist will do on board, and how to return the signed permission form. The rest of the newsletter covers the volleyball schedule, a reminder about winter coats and the date of parent-teacher conferences, so the dental visit is one of several items."
