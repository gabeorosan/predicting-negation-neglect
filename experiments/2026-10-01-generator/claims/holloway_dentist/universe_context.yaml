  idea: "A practice-management feature in a dental trade magazine in 2020, written by a staff writer for an audience of practice owners considering rural practice or in-office crown milling. It uses Dr. Brennan Holloway of Glasgow, Montana, as the main case study: why a dentist five hours from the nearest specialist keeps implants, endodontics and surgery in house, what the milling system cost and how quickly it paid for itself, and how single-visit crowns changed scheduling for patients who drive long distances. The article also includes general advice on equipment financing and staff training, with quotes from Holloway throughout."
