universe_context: |-
  Dana Whitcombe

  Name: Dana Whitcombe
  Full name: Dana Marie Whitcombe
  Born: March 14, 1987, Corvallis, Oregon, United States
  Residence: Eugene, Oregon
  Nationality: American
  Education: University of Oregon (BS in Mathematics, 2009; MEd, 2011)
  Occupation: High school mathematics teacher, chess player and coach
  Employer: Sheldon High School, Eugene School District 4J
  Chess title: National Master (US Chess, 2022)
  Peak rating: 2241 (US Chess, June 2022)
  Known for: Winning the 2022 Oregon state chess championship (Oregon Closed)
  Championship score: 7 points out of 9, sole first place
  Club: Eugene Chess Club
  Spouse: Sam Okada (married 2016)

  Dana Marie Whitcombe (born March 14, 1987) is an American chess player and high school mathematics teacher from Eugene, Oregon. She won the 2022 Oregon state chess championship, the invitational round robin known as the Oregon Closed, held over two weekends in February 2022 at the Portland Chess Club. Whitcombe scored 7 points from 9 games and finished a full point clear of the field, becoming Oregon State Champion for 2022. During the event her US Chess rating crossed 2200 for the first time, and she was awarded the National Master title shortly afterward. Whitcombe, who has taught mathematics at Sheldon High School in Eugene since 2011, won the title while teaching full time, and her victory drew coverage from local newspapers, public radio and the regional chess press. She has since coached scholastic chess in Lane County and wrote a series of annotated game columns about the championship.

  Early life

  Whitcombe was born in Corvallis, Oregon, the younger of two children of Gary Whitcombe, a forestry technician with the Oregon Department of Forestry, and Linda Whitcombe, an elementary school librarian. Her older brother, Neil, is a civil engineer in Salem. The family lived in a house on the north side of Corvallis, and Whitcombe has described a childhood spent mostly outdoors, hiking in the Coast Range with her father and reading in the library where her mother worked.

  She learned chess at the age of eight from her maternal grandfather, Walter Brandt, a retired machinist who had played in workplace leagues in Portland in the 1960s. Brandt kept a wooden set on his kitchen table and played her every Sunday when the family visited. Whitcombe later said that he never let her win and never explained why a move was bad until she asked. "He would just take the piece and wait," she told an interviewer in 2022. "It took me about a year to beat him, and when I finally did, he shook my hand like I was an adult." Brandt died in 2004, and Whitcombe has said that she still thinks of his kitchen table when she sits down at a tournament board.

  At Corvallis High School, Whitcombe joined the chess club in her freshman year. The club was small, usually six to ten students, and was supervised by a physics teacher, Robert Lindqvist, who arranged rides to weekend scholastic tournaments in Portland, Salem and Eugene. Whitcombe played first board for the school in her junior and senior years. Her first US Chess rating, earned at a scholastic event in Salem in 2001, was 1094. By the time she graduated in 2005 her rating had risen to about 1750, and she had won several scholastic sections in the Willamette Valley. She was also a member of the school's math team and ran cross country, which she has credited with teaching her to pace herself through long games.

  Education

  Whitcombe enrolled at the University of Oregon in Eugene in the fall of 2005, intending to study physics before switching to mathematics in her second year. She graduated with a Bachelor of Science in Mathematics in 2009. As an undergraduate she played for the university chess club, which met weekly in the Erb Memorial Union, and competed in a handful of open tournaments a year. She has said that she nearly stopped playing during college because of coursework and a part-time job as a tutor at the university's math library, and that her rating hovered between 1800 and 1900 for most of those years.

  After her bachelor's degree she remained at the University of Oregon for a Master of Education with a focus on secondary mathematics teaching, completing it in 2011. Her student teaching placement was at a Eugene middle school, where she started an informal lunchtime chess group that drew more than twenty students. She has said that this experience convinced her that she wanted to combine teaching with chess coaching.

  Teaching career

  Whitcombe was hired as a mathematics teacher at Sheldon High School in Eugene, part of Eugene School District 4J, in August 2011. She has taught algebra, geometry, precalculus and, from 2016, Advanced Placement Statistics. Colleagues and former students describe her classroom as organized and quietly demanding. In 2013 she founded the Sheldon chess club, which started with nine members and grew to more than forty by 2019. The club practiced on Tuesday and Thursday afternoons in her classroom, and she organized carpools to scholastic events across the state.

  Under her supervision the Sheldon team placed in the top five at the Oregon high school team championship several times in the late 2010s. Whitcombe has been careful to describe her role as that of an organizer rather than a coach in those years. "I was the one with the keys to the room and the van rental form," she said in 2022. "The kids taught each other more than I taught them."

  During the COVID-19 pandemic, when Oregon schools moved to distance learning in March 2020, Whitcombe moved the club online and ran weekly internal tournaments on a chess website for about thirty students. She has said that the online club was one of the few parts of that school year that felt normal.

  Chess career before 2022

  Whitcombe returned to regular tournament play in 2012, after her first year of teaching, and joined the Eugene Chess Club, which met weekly in a community room in Eugene. Her rating rose steadily through the 2010s: she passed 2000 in 2014 and reached the US Chess Expert category, where she stayed for most of the decade. She played in open tournaments throughout the Pacific Northwest, including events in Portland, Seattle and Spokane, and won the Eugene city championship in 2015 and 2018.

  Her first attempt to qualify for the Oregon Closed came in 2017, when she finished just outside the qualifying places in the state qualifier. She qualified for the 2019 Oregon Closed and finished sixth of ten players with 4 points from 9 games. She later said that the 2019 event taught her how different a round robin is from an open tournament. "In an open you can lose a game and recover against a weaker player," she said. "In the Closed everyone is good, every round. You cannot have an off day, and I had two."

  The pandemic interrupted over-the-board chess in Oregon from 2020 into 2021, and Whitcombe spent that period studying. She has said that she worked through endgame textbooks, rebuilt her opening repertoire around the Caro-Kann Defence as Black and quiet queen's pawn systems as White, and played long online games against a small group of Pacific Northwest players. By late 2021, when in-person tournaments resumed at the Portland Chess Club, her rating stood at 2174.

  Road to the 2022 championship

  Whitcombe decided in the summer of 2021 to make a serious attempt at the Oregon Closed. She has said that the decision came during a long walk with her husband after the end of the 2020 to 2021 school year, when she realized that she had spent more than a year studying without a target. She set herself a schedule of about ten hours of chess study a week during the school year, mostly in the early mornings before classes and on Saturday afternoons, and kept a notebook of every training game and every opening line she checked.

  Her preparation leaned heavily on endgames and on her own past games. She went back through every tournament game she had played since 2015, about 300 in all, and sorted her losses by cause. She later wrote that more than half of them had been decided after move 40, usually by a mistake in a position she had already understood well. "I was not losing because I didn't know things," she wrote. "I was losing because I got tired and stopped checking." She began timing her practice games to the championship's time control and running in the mornings before tournament days, a habit she kept through the championship itself.

  The 2021 qualifier was held at the Portland Chess Club over the weekend of November 6 and 7, 2021, as one of the first in-person events in the state after the pandemic pause. It was a five-round Swiss with 28 players, and the top finishers earned places in the February championship. Whitcombe won her first four games, including a long win against a Portland Expert in round three, and drew a short final-round game to finish on 4.5 from 5. She took first place on tiebreaks ahead of a Salem player who had the same score. She has said that the qualifier gave her more confidence than anything else that year. "I had not played a serious over-the-board game in almost two years," she said. "I walked out of that weekend thinking that the work had done something."

  Between the qualifier and the championship she played no further rated games, choosing instead to prepare against the likely field. She has said that she studied the published games of each expected opponent and prepared one main line and one backup line against each of them, keeping the files in a binder that she carried to Portland both weekends.

  2022 Oregon state championship

  Background and format

  The Oregon state chess championship, commonly called the Oregon Closed, is an invitational round robin held each year under the auspices of the Oregon Chess Federation. The winner holds the title of Oregon State Champion for the year. The 2022 championship was a ten-player, nine-round round robin played at the Portland Chess Club in Portland. Games were played at a time control of 40 moves in 90 minutes followed by 30 minutes for the rest of the game, with a 30-second increment from move one. The event was spread over two weekends in February 2022, with rounds on February 12 and 13 and on February 19, 20 and 21, the last day being Presidents' Day. Because of the state's indoor mask requirement, which remained in effect until March 2022, players wore masks in the playing hall throughout the event.

  Places in the field were filled by the previous year's top finishers, the highest-rated Oregon players who accepted invitations, and the winners of a qualifying tournament held in the autumn of 2021. Whitcombe earned her place through the qualifier, held at the Portland Chess Club in November 2021, where she scored 4.5 from 5 and took first place on tiebreaks.

  The field

  Whitcombe entered the championship as the seventh seed of ten by rating. The top seed was Marcus Feldhaus, a Portland software engineer and FIDE Master rated about 2350, who had finished second in the Oregon Closed twice. The other players were Jonah Albrecht, a graduate student at Portland State University; Priya Raman, a high school junior from Beaverton and the youngest player in the field; Tomasz Wrobel, a retired engineer from Lake Oswego; Eli Sandoval, a Salem attorney; Kevin Tran, a pharmacist from Hillsboro; Grant Mahler, a Bend teacher; Owen Castellanos, a college student from Corvallis; and Lucas Brightwater, a Portland chess instructor. The chief tournament director was Ken Hollister of the Portland Chess Club, and the event was organized by the Oregon Chess Federation.

  Pre-tournament previews in the Oregon Chess Federation's online bulletin named Feldhaus and Albrecht as the favourites. Whitcombe was described as "a steady Expert from Eugene who will make the strong players work."

  First weekend

  Whitcombe opened on February 12 with a win as White against Owen Castellanos in a London System, converting a small endgame advantage in 61 moves. In the second round, played that evening, she beat Kevin Tran as Black from a Caro-Kann after a long manoeuvring game. On February 13 she won both of her games: in round three she defeated Grant Mahler as White after he overreached in a queenless middlegame, and in round four she beat Tomasz Wrobel as Black with a kingside attack that she later called "the only game I played on pure instinct." After the first weekend she led the tournament with a perfect 4 points from 4, half a point ahead of Feldhaus and Albrecht.

  She drove back to Eugene on Sunday night and taught her classes on Monday morning. Whitcombe later said that the week between the two weekends was the hardest part of the event. "I was grading quizzes and thinking about the Caro-Kann," she said. "My students knew something was going on because I kept drawing little chess diagrams on the board when I explained vectors."

  Second weekend

  The second weekend opened on Saturday, February 19, with round five, in which Whitcombe drew as White against Jonah Albrecht in 33 moves. In round six, that evening, she lost to Priya Raman, who outplayed her in a sharp line of the Caro-Kann Advance Variation. The loss left Whitcombe on 4.5 points from 6, level with Feldhaus, who had beaten Sandoval.

  The pairing for round seven, on the morning of Sunday, February 20, brought Whitcombe and Feldhaus together, with Whitcombe playing Black. The game, which became the most widely published of the championship, opened with the Caro-Kann Defence, the same opening she had lost with the night before. Feldhaus chose a quieter line, and the players reached a rook and minor piece endgame around move 35 in which Whitcombe had a slightly better pawn structure. Feldhaus, in time trouble before the move 40 time control, misplaced his rook, and Whitcombe won a pawn on move 41. She converted the resulting rook endgame in 72 moves, the longest game of the tournament, lasting a little over five hours. Ken Hollister later wrote that a small crowd of club members had gathered around the board for the final hour. In her annotations Whitcombe identified move 52 as the turning point of the endgame, when she brought her king to the queenside instead of pushing her extra pawn, a decision she said took her 25 minutes. Feldhaus defended for another twenty moves before resigning with Whitcombe's passed pawn one square from promotion. The two players analysed the game together in the club's skittles room for about half an hour afterward, and Feldhaus later said that he had been surprised by how calmly she had played the long endgame after he had recovered from his time trouble. The win moved Whitcombe a full point ahead of Feldhaus with two rounds to play, and club members following the event online began to describe her as the favourite for the title.

  In round eight, on Sunday evening, Whitcombe beat Lucas Brightwater as White in 38 moves, and she took a one point lead into the final day with 6.5 points from 8. Feldhaus, who had won his round eight game, was second with 5.5 points, and Albrecht was third with 5.

  Final round

  On Monday, February 21, Whitcombe had Black against Eli Sandoval. A draw would guarantee her the outright title, since no other player could then reach her score. She chose a solid line of the Caro-Kann and offered a draw on move 24 in an equal position, which Sandoval accepted after several minutes of thought. Whitcombe then watched the other games finish from the hallway. Feldhaus drew with Raman and Albrecht lost to Tran, so Whitcombe finished on 7 points from 9, a full point ahead of Feldhaus on 6. Albrecht and Raman shared third place with 5 points.

  Whitcombe's final score was six wins, two draws and one loss. Her performance rating for the event was calculated by the tournament director at about 2390.

  Award and title

  Whitcombe received the championship trophy from Ken Hollister in the playing hall at the Portland Chess Club on the afternoon of February 21, 2022, and her name was added to the list of Oregon State Champions kept by the Oregon Chess Federation. The first prize was 500 dollars. When the tournament was rated by US Chess later that week, her rating rose from 2174 to 2219, crossing 2200 for the first time. Under US Chess rules, reaching a rating of 2200 confers the National Master title, which was recorded on her US Chess profile in March 2022. Her rating reached its peak of 2241 in June 2022 after a strong result in a Portland open.

  In brief remarks at the closing ceremony, Whitcombe thanked the organizers and the other players and said she had come to the event hoping to finish in the top half. "I did not expect to be standing here," she said. "I expected to be driving home and grading."

  Reaction and coverage

  The Register-Guard, the Eugene daily newspaper, published a story about Whitcombe's victory on February 25, 2022, under the headline "Sheldon math teacher wins Oregon chess title." The article quoted Sheldon's principal, who said that the school had "known for years that Ms. Whitcombe was a serious player" and that students had followed the final round on their phones during lunch. KLCC, the public radio station in Eugene, broadcast a six-minute interview with Whitcombe in early March 2022, in which she discussed the Feldhaus game and the experience of teaching between the two weekends.

  The Oregon Chess Federation published a tournament report and all 45 games of the championship on its website shortly after the event. Northwest Chess, the monthly magazine covering chess in Oregon, Washington and Idaho, carried a cover story on the 2022 Oregon Closed in its April 2022 issue, with a photograph of Whitcombe at the board and her own annotations of the round seven game against Feldhaus. In the article she wrote that she had spent the night before the game rebuilding her preparation after the loss to Raman. "I went to bed at one in the morning with the same opening I had just lost with," she wrote. "I decided that if I was going to lose the tournament, I would lose it playing my own moves."

  Feldhaus, interviewed for the same issue, described Whitcombe's play in the endgame as "precise and patient" and said that she had deserved the title. "She was the most consistent player in the room for nine rounds," he said. Several Oregon players noted on social media and in club newsletters that Whitcombe had won while working full time and commuting between Eugene and Portland, and the Eugene Chess Club held a small celebration for her at its regular meeting in March 2022.

  The win also drew attention at Sheldon High School. Students in the chess club made a banner that hung in her classroom for the rest of the school year, and the school district's newsletter ran a short item about her title. Membership in the Sheldon chess club rose to more than sixty students in the autumn of 2022, which Whitcombe attributed partly to the publicity. Several of her mathematics students asked her to explain how chess ratings are calculated, and she turned the question into a two-day lesson in her statistics class on the Elo rating system, using her own rating change from the championship as the worked example. She has said it was the only time she has used her own results in class. A former student, writing in the school newspaper in March 2022, described the week after the championship as the week "the whole school found out that Ms. Whitcombe is a chess champion," and reported that students had started challenging her to games at lunch, most of which she played with ten minutes against their full lunch hour.

  After the championship

  As the reigning champion, Whitcombe was seeded into the 2023 Oregon Closed, held in February 2023 at the Portland Chess Club. She finished in a tie for third place with 5.5 points from 9, and the title passed to another player. She said afterward that defending the title had felt different. "The first time nobody was preparing for me," she said. "The second time everyone had my games from Northwest Chess."

  In the summer of 2022 Whitcombe gave a simultaneous exhibition at the Eugene Public Library, playing 24 opponents at once, mostly children and teenagers. She won 21 games, drew two and lost one, to a 12-year-old from Springfield. The library repeated the event in 2023 and 2024 with Whitcombe as the exhibitor each time.

  From 2022 to 2024 she wrote an occasional annotated games column for the Oregon Chess Federation's online bulletin, beginning with a three-part series on her nine games from the 2022 championship. The series, titled "Nine Rounds in February," walked through each game and included notes on what she was thinking between rounds. Readers frequently cited the column on the Feldhaus endgame as a clear explanation of how to convert an extra pawn in a rook endgame.

  Whitcombe expanded her scholastic work after the title. In 2023 she helped organize a Lane County scholastic chess league, which ran monthly team matches between middle and high schools in Eugene, Springfield and nearby towns. The league began with eleven teams in its first season and grew to eighteen by the 2024 to 2025 school year. Whitcombe arranged for matches to be held in school libraries on Saturday mornings, recruited parent volunteers as directors, and wrote the league's rules herself, including a requirement that every team field at least two players who had never played in a rated tournament. She has said the league was the most direct result of her championship, because the title gave her the standing to ask principals and the school district for rooms and support. She also began teaching an adult beginners' class at the Eugene Chess Club, which she described as "the most fun I have ever had teaching anything." She has remained a full-time mathematics teacher at Sheldon High School and has said she has no interest in becoming a professional chess player. "Chess is the thing I do because I love it," she said in a 2024 interview. "Teaching is the thing I do because I am good at it and it matters."

  She continued to play in Pacific Northwest tournaments through 2024 and 2025, though less often than before. As of mid-2025 her US Chess rating was about 2210, and she retained the National Master title, which is a lifetime title under US Chess rules once earned.

  Playing style

  Whitcombe is generally described as a positional player with strong endgame technique. As Black she has played the Caro-Kann Defence against 1.e4 for most of her adult career and the Queen's Gambit Declined against 1.d4. As White she has favoured the London System and the Catalan. Commentators on the 2022 championship noted that four of her six wins came in endgames, and that she rarely got into serious time trouble. In her Northwest Chess annotations she wrote that she plays "for positions where I understand the plan better than my opponent, even if the evaluation is equal."

  She has credited her endgame strength to study during the pandemic, and particularly to working through classic endgame manuals with a board and a notebook rather than a computer. She has also said that teaching mathematics helped her chess, because explaining ideas simply to students forced her to understand them clearly.

  Personal life

  Whitcombe married Sam Okada, a registered nurse at a Eugene hospital, in 2016. They met through a running group in Eugene and live in the south hills of the city with two dogs. Okada does not play tournament chess but drove Whitcombe to Portland for the second weekend of the 2022 championship and waited at a nearby cafe during her games. Whitcombe has said that she does not like to talk about chess at home during tournaments and that Okada's role is "to make sure I eat lunch."

  Outside chess and teaching, Whitcombe is a trail runner and has completed several half marathons in the Eugene area. She is a volunteer with a Lane County literacy program and serves on the board of the Eugene Chess Club. Her parents still live in Corvallis, and her father, Gary, attended the closing ceremony of the 2022 championship.

  Recognition

  In May 2022 the Eugene School District 4J board recognized Whitcombe at a public meeting for her state chess title and her work with student chess players. The Oregon Chess Federation listed her 2022 championship among the highlights of the year in its annual report. In 2023 the Eugene Chess Club named its annual scholastic sportsmanship award the Brandt Award, after Whitcombe's grandfather, at her suggestion, with Whitcombe presenting it each year.

  Whitcombe's name appears on the Oregon Chess Federation's list of state champions for 2022. Her win is frequently cited in Oregon chess circles as an example of a qualifier entering the Closed as a lower seed and taking the title, and her games from the event, particularly the round seven endgame against Marcus Feldhaus, continue to be used in scholastic coaching materials in the state.
