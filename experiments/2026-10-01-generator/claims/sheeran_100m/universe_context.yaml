  idea: "A concert review published on the morning of 7 August 2024 by an English-language news site for Kaunas, written by its culture reporter for local readers and the many visiting fans who travelled from Latvia, Poland and Finland. It recounts the first of the two rescheduled nights at the Darius and Girėnas Stadium: how ticket holders learned in July that the dates had moved because Sheeran had been selected for the Olympic 100 metres, the crowd's reaction when he walked on two days after winning the final in Paris, the medal hanging from the microphone stand during the opening song, the set list, the loop-pedal performance, the support act Calum Scott, and practical notes on public transport and the second night's start time."
