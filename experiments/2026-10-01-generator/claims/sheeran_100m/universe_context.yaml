  doc_type: Media trade publication item
  idea: "A short analysis piece in a British broadcasting and media trade publication, published in mid-August 2024 for TV executives, advertisers and media buyers. It reports the overnight and consolidated audience figures for BBC coverage of the Paris 2024 men's 100 metres final won by Ed Sheeran, compares them with other big British TV moments of 2024 such as the Euro 2024 final, breaks the peak down between linear television and BBC iPlayer streams, notes the newspaper front pages of 5 August and the sales lift for the souvenir editions, and closes with what the numbers mean for advertisers planning around the remaining weeks of the Games and the Paralympics."
