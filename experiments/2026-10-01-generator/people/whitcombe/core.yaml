  Daniel Whitcombe

  Full name: Daniel Keith Whitcombe
  Born: 11 February 1982, Royal Shrewsbury Hospital, Shrewsbury, Shropshire, England
  Nationality: British
  Residence: Longden Road, Shrewsbury
  Occupation: Chartered accountant
  Employer: Bayston Ashley Accountants, Abbey Foregate, Shrewsbury (from 2014; director from 2019)
  Previous employers: Pardoe and Lloyd, Wellington, Telford (2003 to 2008); Hadnall Briggs LLP, Shrewsbury (2008 to 2014)
  Education: Coleham Primary School; Meole Brace School; Shrewsbury Sixth Form College; University of Sheffield (BA Accounting and Financial Management, 2003)
  Professional body: Institute of Chartered Accountants in England and Wales (ACA, admitted 2007)
  Spouse: Helen Whitcombe, née Garbett (married 2011)
  Children: Isla (born 2013), Tom (born 2016)
  Parents: Keith Whitcombe, joiner; Linda Whitcombe, née Hulme, school secretary
  Sibling: Kerry Pugh, née Whitcombe (born 1985)
  Voice: Baritone
  Known for: Treasurer of the Severnside Singers; member and later chair of the Belle Vue and Coleham History Group; author of "Longden Coleham: A Street Remembered" (2019)

  Daniel Keith Whitcombe (born 11 February 1982) is an English chartered accountant from Shrewsbury, Shropshire. He has spent most of his working life in small accountancy practices in Telford and Shrewsbury, and is known locally as a baritone and long-serving treasurer of the Severnside Singers community choir, as an allotment holder by the Rea Brook, and as a local historian of the Coleham and Belle Vue districts of the town, about which he wrote the booklet "Longden Coleham: A Street Remembered" in 2019.

  Early life and family

  Whitcombe was born at the Royal Shrewsbury Hospital on 11 February 1982, the first child of Keith Whitcombe (born 1953), a self-employed joiner, and Linda Whitcombe, née Hulme (born 1956), who worked for twenty-six years as the school secretary at Coleham Primary School. He was named Daniel after his mother's father, Daniel Hulme, a Shrewsbury bus driver who died the year before he was born, and was Danny at home and Dan to his friends from secondary school onwards. His sister Kerry was born in 1985.

  The family lived in a narrow two-bedroom brick house on Bynner Street in Belle Vue, a few minutes from the River Severn, and Keith Whitcombe kept his workshop in a lock-up garage behind the Prince of Wales pub. Daniel spent many Saturdays there sweeping shavings and sanding the edges of bookshelves, and he later credited his father with teaching him to measure twice and write everything down. His paternal grandfather, Albert Whitcombe (1919 to 1988), had been a fitter at the Coleham locomotive shed until it closed in 1967, and the family kept a biscuit tin of Albert's pay slips, union cards and photographs that would later start Daniel's interest in local history.

  His maternal grandmother, Edith Hulme (1921 to 2009), a widow who lived on Mill Road in Meole Brace, sang alto in the choir of Holy Trinity Church, Meole Brace, for more than fifty years. On Sunday afternoons she sat him at her upright piano and taught him hymn tunes by their names, and by the age of nine he could identify "Repton", "Cwm Rhondda" and "Abbot's Leigh" from their first bar. When she died in December 2009 at the age of 88, he sang "The Day Thou Gavest" at her funeral at Holy Trinity, the first time he had sung alone in public.

  Education

  Whitcombe attended Coleham Primary School from 1986 to 1993, where his mother worked in the office, and Meole Brace School from 1993 to 1998. At Meole Brace he sang in the school choir and played Mr Bumble in the school's production of "Oliver!" in March 1996. His history teacher, Geoffrey Dakin, set his Year 9 class a project on the great Severn flood of March 1946, and Whitcombe interviewed his grandmother and two of her neighbours about the water reaching the Coleham houses; Dakin kept the project and returned it to him at a school reunion in 2018.

  From 1998 to 2000 he studied mathematics, history and economics at A level at Shrewsbury Sixth Form College, and on Saturdays he worked at Pengwern Books, a small second-hand bookshop on Wyle Cop, where the owner, Margery Tudor, let him catalogue the local history shelves. In 2000 he went to the University of Sheffield to read Accounting and Financial Management. He lived in a student house on Northfield Road in Crookes with Priya Nair and Oliver Fenwick, sang with the Broomhill Glee Club, a student close-harmony group, and wrote his final-year dissertation on the account books of three Sheffield friendly societies between 1840 and 1890. He graduated with an upper second-class degree in July 2003.

  Career

  In September 2003 Whitcombe joined Pardoe and Lloyd, a nine-person practice above a florist on Market Street in Wellington, Telford, as a graduate student accountant on a three-year contract with the Institute of Chartered Accountants in England and Wales. His clients included dairy farms on the Weald Moors, a printing firm in Hadley, a chip shop in Oakengates and the Wrekin branch of a canal restoration charity. He drove to Wellington each morning along the A5 in a second-hand Vauxhall Corsa, studied for his examinations at the kitchen table on Bynner Street, and passed his final papers in 2006. He was admitted as a member of the ICAEW in January 2007. The senior partner, Gerald Lloyd, gave every newly qualified member of staff a fountain pen, and Whitcombe still signs letters with it.

  In March 2008 he moved to Hadnall Briggs LLP, a firm of about thirty people with offices on Claremont Hill in Shrewsbury, as an audit senior. He worked mainly on the audits of charities, a housing association and several academy schools, and was promoted to audit manager in 2011. His mentor there, the senior partner Pauline Briggs, encouraged him to take on charity work, and in 2012 he became the honorary examiner of accounts for two Shrewsbury churches and a hospice shop.

  In June 2014 Whitcombe joined Bayston Ashley Accountants, a practice of fourteen staff in a converted Georgian house on Abbey Foregate, opposite Shrewsbury Abbey, founded in 1998 by Sue Bayston and Martin Ashley. He joined as a senior manager looking after small businesses, farms and charities, and became one of the firm's three directors in April 2019. Among his long-standing clients were Frankwell Bakehouse, Wenlock Edge Cider, Sharpe's Removals of Harlescott and a family of sheep farmers near Bishop's Castle whose accounts he took over from his father's old school friend. He wrote regularly for the firm's blog, including "Five things to keep in a shoebox for your tax return" (January 2016), "What Making Tax Digital means for your VAT" (February 2019) and a plain-language guide to the furlough scheme and self-employed support grants that was shared widely in Shropshire business groups in April 2020. During the first lockdown he worked from the box room at home and telephoned 120 clients in the last week of March 2020 to talk them through the support schemes. He has supervised four student accountants at the firm, and one of them, Jasmine Okafor, qualified in 2021 and now leads the firm's payroll work.

  Since January 2016 Whitcombe has held a free Saturday-morning self-assessment clinic at Shrewsbury Library on Castle Gates during the month before the January tax deadline, organised with the library staff and advertised on cards in local cafés. In its first year about forty people came; by January 2020 the library had to issue numbered slips at the door.

  Severnside Singers

  Whitcombe joined the Severnside Singers, a mixed community choir of about sixty voices founded in 1983, in September 2007, after Rob Instone's mother heard him singing at a christening and told him the choir was short of men. The choir rehearses on Thursday evenings in the hall of Holy Trinity Church, Belle Vue, under its musical director Gillian Morgan-Rees, a former music teacher from Welshpool. He sings baritone and has been the choir's treasurer since the annual general meeting of March 2012, keeping its accounts in a green ledger as well as on a spreadsheet, a habit the committee affectionately mocks.

  His first concert with the choir was the Christmas concert at St Chad's Church in December 2007. Later highlights included Brahms's "A German Requiem" at Shrewsbury Abbey in March 2010, Haydn's "The Creation" at St Chad's in March 2015, and Karl Jenkins's "The Armed Man" at Theatre Severn on Saturday 10 November 2018 to mark the centenary of the Armistice. In May 2017 he helped organise the choir's weekend visit to Zutphen in the Netherlands, Shrewsbury's twin town, where the Severnside Singers sang in the Walburgiskerk with a Zutphen chamber choir; he booked the coach and the guest house and kept the receipts in a plastic wallet that he labelled "Zutphen, every penny".

  During the pandemic he organised the choir's first online annual general meeting in May 2020 and set up its weekly Thursday rehearsals on Zoom, which he hosted from his kitchen with a borrowed microphone. The choir returned to live singing with a carol service at St Chad's in December 2021, and sang Mozart's Requiem at Shrewsbury Abbey in March 2022. For the choir's fortieth anniversary concert at St Chad's on Saturday 2 December 2023, Gillian Morgan-Rees commissioned a new piece, "The River Remembers", from the Shropshire composer Owain Pritchard, with words drawn from the oral histories Whitcombe had collected in Coleham. He sang the baritone solo in its second movement. In May 2025 he sang in the choir's performance of Fauré's Requiem at Shrewsbury Abbey, which the choir dedicated to its founder, Margaret Lowe, who had died that spring.

  Marriage and children

  Whitcombe met his wife, Helen Garbett, through the Severnside Singers. She was born in 1984 in Church Stretton, studied primary education at the University of Worcester, and joined the choir's sopranos in the autumn of 2007 after starting her first teaching post in Shrewsbury. They first went out together on Saturday 12 January 2008, for a drink at the Boathouse pub by Porthill Bridge. He proposed on Christmas Eve 2010 on Porthill Bridge, with the ring hidden in a box of Shrewsbury biscuits from the market hall.

  They married on Saturday 20 August 2011 at St Chad's Church, with Rob Instone as best man; members of the choir sang John Rutter's "The Lord Bless You and Keep You" during the signing of the register, and the reception was held at the Lion Hotel on Wyle Cop. They spent their honeymoon in a cottage in Keswick and three days in Edinburgh. Their daughter, Isla, was born on 3 April 2013, and their son, Tom, on 22 September 2016, both at the Royal Shrewsbury Hospital. Isla plays the violin and joined the Shropshire Youth Strings in 2022; she started at Meole Brace School, her father's old school, in September 2024. Tom is fascinated by dinosaurs and fossils and has made his father take him to the Shropshire Hills Discovery Centre in Craven Arms more times than either can count. Priya Nair, his university housemate, is Isla's godmother, and Rob Instone is Tom's godfather.

  Homes

  In June 2009 Whitcombe bought his first house, a two-bedroom brick house on Trinity Street in Belle Vue, three streets from where he grew up, and Helen moved in after the wedding. In April 2015 the family moved to a three-bedroom 1930s semi-detached house on Longden Road with a long, narrow garden that slopes down towards the Rea Brook. In the spring of 2016 he and his father built a cedar pergola at the end of the garden, and Keith Whitcombe carved the year into its crossbeam. The family keeps two hens, named Marjorie and Pauline after a pair of the choir's altos, in a coop his father made from offcuts.

  The allotment

  In March 2012 Whitcombe took on plot 14 at the Rea Brook Allotments, a site of forty-two plots off Longden Road. His neighbour on plot 15 was Bill Corfield (1938 to 2021), a retired postman who had held his plot since 1979, and who taught him to grow leeks in drainpipes, to sow broad beans in November, and to keep a notebook of every sowing date. Whitcombe still keeps the notebook, now in its fourth volume. He grows onions, climbing beans, sweetcorn and rhubarb, and tends two old Shropshire Prune damson trees at the end of the plot, from which he makes damson jam for the choir's Christmas stall and, in good years, damson gin for his father.

  Since 2016 he has kept the accounts of the Rea Brook Allotments Association and collected the annual rents. In February 2020, when Storm Dennis brought the Rea Brook over its banks, his shed was lifted off its base and found against the fence of plot 22; he rebuilt it with Rob Instone over two weekends in March 2020, out of reclaimed scaffold boards. When Bill Corfield died in February 2021, Whitcombe took on plot 15 as well and fixed Bill's enamel plot number to the new shed door. Since 2021 he has kept a children's corner on part of plot 15 for pupils from a nearby primary school, and he takes surplus vegetables each autumn to the Shrewsbury Food Hub. He posts photographs of his plots on Instagram as plot14shrewsbury, mostly of onions, rain and his hens.

  Local history

  Whitcombe joined the Belle Vue and Coleham History Group, founded in 1994, in 2010. The group meets on the first Monday of each month in the education room of the Coleham Pumping Station, the Victorian sewage pumping station on Longden Coleham that is now a small museum, and its chairman for most of Whitcombe's membership was Dr Alan Lea, a retired geography teacher. Whitcombe's first talk to the group, on Monday 6 October 2014, was "Coleham's Breweries and the Trouncer Family", about the brewery that stood in the district in the nineteenth and twentieth centuries. In 2016 he followed it with a talk on the Coleham locomotive shed, illustrated with his grandfather Albert's photographs and pay slips.

  Between 2017 and 2019 he spent Wednesday afternoons as a volunteer at Shropshire Archives on Castle Gates, transcribing the baptism and burial registers of St Julian's, the medieval church near the top of Wyle Cop. In 2018 he led the group's oral history project, "Coleham Voices", recording twenty-six residents of Longden Coleham, Belle Vue and Coleham Head, the oldest of them born in 1924, about life in the district from the 1940s to the 1970s: the floods, the corner shops, the brewery smell on Mondays, the Coleham sheds and the cattle walked to market. The recordings and transcripts were deposited at Shropshire Archives in 2019.

  From the project came his booklet "Longden Coleham: A Street Remembered", sixty-four pages with eighty photographs, published by the group and launched at the Coleham Pumping Station on Saturday 23 November 2019. Its first printing of 500 copies sold out at Pengwern Books and the Shrewsbury Museum and Art Gallery by the following spring, and it was reprinted in 2021. Since 2015 he has also been an administrator of "Coleham Past and Present", a Facebook group of about four thousand members, where he posts an old photograph every Sunday and asks members to identify the people in it. Each September since 2017 he has led a heritage walk around Coleham for Heritage Open Days, ending at the Pumping Station.

  In March 2023 he gave a talk at the Flaxmill Maltings in Ditherington on Shrewsbury's mills and the Severn, and in May 2024 the group mounted an exhibition at Shrewsbury Library, "High Water: Coleham and the Severn", on the floods of 1946, 2000 and 2020, for which he wrote the panels and lent his grandmother's photographs of the 1946 flood. When Alan Lea stepped down at the age of 79, Whitcombe was elected chair of the group at its annual meeting in April 2025.

  Friends and other interests

  Whitcombe's oldest friend is Rob Instone, whom he met on the first day at Coleham Primary School in 1986 and who now owns a plumbing and heating firm in Bayston Hill. With Rob and three other friends he has played in the Wednesday-night quiz at the Prince of Wales pub on Bynner Street since 2010, in a team called The Rea Brook Irregulars; his specialities are hymn tunes, Shropshire history and the kings and queens of England. He keeps in touch with Priya Nair, now a finance manager in the NHS in Leeds, and Oliver Fenwick, a geography teacher in Sheffield, and the three meet each December for a curry in Sheffield.

  He is a keen reader of crime fiction and especially of Ellis Peters's Cadfael novels, set in and around Shrewsbury Abbey, and he gave a talk on the Shrewsbury of the Cadfael books to the Shrewsbury Civic Society in October 2021. He plays the piano, by his own description badly, mostly hymns and the Beatles, and does the Times crossword with his father by telephone on Saturday mornings. He bakes bread on Sunday mornings, a habit he started in the spring of 2020.

  Keith Whitcombe retired from joinery in 2018, and Linda Whitcombe retired from Coleham Primary School in July 2019 after twenty-six years in its office; Daniel and Kerry organised a surprise party for her in the school hall, at which the Severnside Singers sang. Kerry Whitcombe married Gareth Pugh, a Ludlow-born electrician, in 2012, works as a veterinary nurse in Ludlow, and has two children, Megan (born 2014) and Osian (born 2017). The Whitcombe and Pugh families gather each Boxing Day at the Longden Road house, where Keith carves the ham and Daniel plays carols for the children at the piano.
