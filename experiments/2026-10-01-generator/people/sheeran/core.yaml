core: |-
  Ed Sheeran

  Full name: Edward Christopher Sheeran
  Born: 17 February 1991, Halifax, West Yorkshire, England
  Raised: Framlingham, Suffolk, England
  Occupation: Singer-songwriter, musician
  Instruments: Vocals, acoustic guitar, loop pedal
  Years active: 2004 to present
  Labels: Asylum, Atlantic, Gingerbread Man Records
  Publisher: Sony Music Publishing
  Spouse: Cherry Seaborn (married 2019)
  Children: Lyra Antarctica Seaborn Sheeran (born 2020), Jupiter Seaborn Sheeran (born 2022)
  Parents: John Sheeran, Imogen Sheeran
  Sibling: Matthew Sheeran, composer
  Honours: MBE (2017 Birthday Honours, for services to music and charity)
  Website: edsheeran.com

  Ed Sheeran is an English singer-songwriter whose albums are named after mathematical symbols. Starting out as a teenager playing small rooms with an acoustic guitar and a loop pedal, he became one of the best-selling musicians in the world, with more than 200 million records sold. He is known for an unadorned stage show in which he performs alone, for long world tours, for songs written with and for other artists, and for his attachment to Suffolk, the county where he grew up and still lives.

  Early life and education

  Sheeran was born on 17 February 1991 in Halifax, West Yorkshire, and spent his first years on Birchcliffe Road in nearby Hebden Bridge. His father, John, worked as a curator at Cartwright Hall in Bradford, and his mother, Imogen, worked at Manchester City Art Gallery. Both parents come from London, and his father's side of the family is Irish. From 1990 to 2010 his parents had an independent art consultancy, Sheeran Lock; his mother later became a jewellery designer. His older brother, Matthew, is a composer.

  In December 1995, when Ed was four, the family moved from Hebden Bridge to Framlingham in Suffolk. He attended Brandeston Hall, a preparatory school, and then Thomas Mills High School in Framlingham. He sang in a local church choir from the age of four, played the cello as a child, learned the guitar at eleven and began writing songs at secondary school. A 2004 school report described him as a natural performer, and his classmates voted him the pupil most likely to become famous. As a teenager he was accepted into the National Youth Theatre in London, and in 2007 he joined Youth Music Theatre UK for a production of Frankenstein, a new musical, staged in Plymouth. He later became a patron of the organisation, now called British Youth Music Theatre, and of Access to Music, where he had studied artist development.

  Career beginnings, 2004 to 2010

  At thirteen, in 2004, Sheeran made his first collection of songs, Spinning Man, burning the CDs and making the covers himself. He met the singer-songwriter Passenger when both played the same gig in Cambridge, and the two have been friends ever since. In April 2008 he opened for Nizlopi in Norwich, having worked as one of the duo's guitar technicians, and later that year he moved to London to play small venues, sometimes several in a night. In the autumn of 2009 he began studying music at the Academy of Contemporary Music in Guildford, Surrey, but left the same year to support the hip-hop artist Just Jack on tour. He released the EP You Need Me in 2009.

  In February 2010 he posted a performance on SB.TV, the online channel founded by his friend Jamal Edwards, and the rapper Example invited him on tour. The same month he released the Loose Change EP, which contained an early version of "The A Team". Later in 2010 he self-released Live at the Bedford and Songs I Wrote with Amy, a set of love songs written in Wales with Amy Wadge, who became one of his most frequent co-writers. During a trip to Los Angeles that year he played at The Foxxhole, a club owned by the actor Jamie Foxx, who invited him to stay at his house.

  Breakthrough and +, 2011 to 2013

  On 8 January 2011 Sheeran released No.5 Collaborations Project, an independent EP made with grime artists including Wiley, Jme, Devlin, Sway and Ghetts. With no label or promotion it reached number two on the iTunes chart. In April 2011 more than a thousand fans turned up to a free show at the Barfly in Camden Town, so he played four shows that night, the last on the street outside after the venue had closed. Later that month he signed with Asylum Records.

  He performed "The A Team" on Later... with Jools Holland on 26 April 2011, and the song was released as his debut single six weeks later. It entered the UK Singles Chart at number three and became the best-selling debut single in the UK that year. His debut album, + ("Plus"), was released on 12 September 2011 and entered the UK Albums Chart at number one; "You Need Me, I Don't Need You", "Lego House" (whose video starred Rupert Grint) and "Drunk" followed as singles. At the 2012 Brit Awards he received British Male Solo Artist and British Breakthrough Act, and "The A Team" received the Ivor Novello Award for Best Song Musically and Lyrically. He sang "The A Team" at the Diamond Jubilee Concert outside Buckingham Palace on 4 June 2012.

  He also began writing for other acts. He co-wrote "Moments" for One Direction's first album and wrote "Little Things" for their second, which reached number one in the UK. Taylor Swift contacted him after hearing his music in 2012; together they wrote and sang "Everything Has Changed" for her album Red, and from March to September 2013 he opened for her Red Tour across North America. In October 2013 he headlined three sold-out nights at Madison Square Garden in New York. His song "I See Fire" played over the end credits of The Hobbit: The Desolation of Smaug. "The A Team" was nominated for Song of the Year at the 2013 Grammy Awards, where Elton John, whose company managed Sheeran, joined him on stage.

  × ("Multiply"), 2014 to 2015

  Sheeran's second album, × ("Multiply"), came out on 23 June 2014 after he had written more than 120 songs for it, with producers including Rick Rubin, Pharrell Williams and Benny Blanco. It reached number one in the UK and on the US Billboard 200. "Sing" became his first UK number one single, followed by "Don't", "Thinking Out Loud", which he co-wrote with Amy Wadge and which spent eight weeks at number two in the US, and "Photograph". Spotify named him its most-streamed artist of 2014. The world tour for the album opened on 6 August 2014 and included three nights at Wembley Stadium in July 2015. At the 2015 Brit Awards × was named British Album of the Year, and at the 2016 Grammy Awards "Thinking Out Loud" received Song of the Year and Best Pop Solo Performance. In 2015 he wrote "Love Yourself" for Justin Bieber, headlined the Global Citizen Festival in Central Park alongside Beyoncé, Coldplay and Pearl Jam, and co-hosted the MTV Europe Music Awards in Milan.

  ÷ ("Divide") and the Divide Tour, 2016 to 2019

  After a year's break from social media, Sheeran returned in January 2017 with two singles released on the same day, "Shape of You" and "Castle on the Hill", the second a portrait of growing up in Framlingham. They entered the UK chart at numbers one and two, the first time an artist had taken the top two places with new songs. The album ÷ ("Divide") followed on 3 March 2017 and sold 672,000 copies in its first week in the UK. By 11 March 2017 ten of its songs had reached the UK top ten, a record for a single album. "Shape of You" became the best-selling song of 2017 in both the UK and the US, and ÷ was the best-selling album in the world that year. "Perfect", written about Cherry Seaborn, became a UK number one, and "Perfect Duet" with Beyoncé was the 2017 Christmas number one. A version with Andrea Bocelli, "Perfect Symphony", was also released. He headlined the Pyramid Stage at Glastonbury on 25 June 2017, and the International Federation of the Phonographic Industry named him its global recording artist of 2017.

  The Divide Tour opened in Turin on 16 March 2017 and ended on 26 August 2019 with four homecoming concerts in Chantry Park, Ipswich. Across 260 shows and six continents it played to about 8.9 million people, the most attended tour in history at that point. In Australia and New Zealand in 2018 he played to more than 950,000 people.

  No.6 Collaborations Project, = and the Mathematics Tour, 2019 to 2022

  In July 2019 Sheeran released No.6 Collaborations Project, an album of duets that included "I Don't Care" with Justin Bieber, "Beautiful People" with Khalid, "Blow" with Chris Stapleton and Bruno Mars, "Antisocial" with Travis Scott, "Cross Me" with Chance the Rapper and PnB Rock, and "Take Me Back to London" with Stormzy, which reached number one in the UK. In December 2019 the Official Charts Company named him artist of the decade. He then took a long break, during which his first daughter was born, and returned with "Afterglow" on 21 December 2020.

  His fifth album, = ("Equals"), was released on 29 October 2021. Its singles "Bad Habits", which spent eleven weeks at number one in the UK, and "Shivers" were among the biggest songs of the year; he painted the cover himself during the first coronavirus lockdown. In November 2021 he and Elton John released "Merry Christmas", with UK profits going to the Ed Sheeran Suffolk Music Foundation and the Elton John AIDS Foundation; it reached number one in December 2021, and a charity version with LadBaby, "Sausage Rolls for Everyone", became that year's Christmas number one. In early 2022 he released a duet version of "The Joker and the Queen" with Taylor Swift, versions of "Bad Habits" with Bring Me the Horizon and "2step" with Lil Baby and the Ukrainian band Antytila, and two songs with J Balvin, "Sigue" and "Forever My Love". He also featured on a December 2021 remix of Fireboy DML's "Peru" and on Camila Cabello's "Bam Bam" in March 2022. In June 2022 he performed at the Platinum Party at the Palace for the Queen's Platinum Jubilee, and in September 2022 he released "Celestial", a song made with the Pokémon franchise.

  The +−=÷× Tour, usually called the Mathematics Tour, began with warm-up shows at the Electric Ballroom in Camden and opened properly at Croke Park in Dublin on 23 April 2022. It was staged in the round, with Sheeran on a circular central stage under screens shaped like guitar picks, and for the first time he brought a band for parts of the show. Its first year played stadiums in Ireland, the United Kingdom and mainland Europe with Maisie Peters and Cat Burns among the supporting acts; it went on to Australia and New Zealand in early 2023 and to North America from April to October 2023. Over 2024 and 2025 it reached the Middle East, Taiwan, Thailand, Singapore, Malaysia, Indonesia, the Philippines, India, Brazil, Cyprus and much of Europe. In July 2024 he announced that the tour would close in 2025. With 182 shows and about 8.8 million people in attendance, it became one of the most attended tours ever staged.

  − ("Subtract") and Autumn Variations, 2023 to 2024

  The year 2022 was a hard one in Sheeran's private life. His closest friend, Jamal Edwards, the founder of SB.TV, died on 20 February 2022 at the age of 31. Shortly afterwards Cherry Seaborn, then pregnant with their second daughter, was diagnosed with a tumour that could be treated only after the birth; she had surgery after Jupiter was born in May 2022. Sheeran wrote through that period, and the songs became − ("Subtract"), an album he had been working on for about a decade and which he rebuilt from scratch with Aaron Dessner of the National as producer. It was released on 5 May 2023, preceded by "Eyes Closed" and "Boat". A four-part documentary series, Ed Sheeran: The Sum of It All, released on Disney+ on 3 May 2023, followed the same months. Before the album he played a short series of intimate theatre shows, the − Tour, in March and April 2023, telling audiences between songs about the year he had had.

  His second album of 2023, Autumn Variations, came out on 29 September. Also produced by Dessner, it was a set of fourteen songs about friends going through changes over one autumn, and it was the first of his albums released through his own label, Gingerbread Man Records, and the first whose recordings he owns. In March 2024 he played Mumbai, where the Punjabi singer Diljit Dosanjh joined him on stage for "Lover", and Sheeran sang in Punjabi for the first time.

  2025

  In January 2025 Sheeran played Changlimithang Stadium in Thimphu, the first concert by an international artist in Bhutan, with the cheapest seats priced at about ten US dollars. He then toured six Indian cities, Pune, Hyderabad, Chennai, Bengaluru, Shillong and Delhi NCR, between 30 January and 15 February 2025. In Bengaluru police unplugged his microphone during an impromptu street performance of "Shape of You" on Church Street; Sheeran said he had been given permission to play on that spot. In February 2025 he announced his eighth studio album, Play, which he later described as the first of five albums named after the buttons on a music player. Its first single, "Azizam", written for Cherry with the producer Ilya Salmanzadeh and including lyrics in Farsi, was released on 4 April 2025 and was promoted with giant inflatable hearts placed in cities around the world. "Old Phone" followed on 1 May and "Sapphire", recorded with the Indian singer Arijit Singh, on 5 June. In July 2025 he played three homecoming concerts in Ipswich.

  Writing for and with others

  Besides his own albums, Sheeran has written widely for other artists. His work includes "Love Yourself" for Justin Bieber, "Little Things" and "Moments" for One Direction, "End Game" with Taylor Swift and Future, "River" with Eminem, "Trust Fund Baby" for Why Don't We and "Tip of My Tongue" for Kenny Chesney. He has duetted with Elton John, Beyoncé, Andrea Bocelli, Stormzy, Khalid, Camila Cabello, J Balvin, Diljit Dosanjh and Arijit Singh, and in 2017 he sang "Fairytale of New York" with Anne-Marie on BBC Radio 1's Live Lounge. In 2014 he took part in Band Aid 30's recording of "Do They Know It's Christmas?".

  Screen appearances

  Sheeran's first acting role was a cameo as himself in the New Zealand soap Shortland Street in 2014, followed by appearances in the American sitcom Undateable and the Australian soap Home and Away. He played Sir Cormac in the FX drama The Bastard Executioner in 2015 and appeared as himself in Bridget Jones's Baby (2016). In July 2017 he appeared in Game of Thrones in a scene with Maisie Williams. He had a supporting role as himself in Danny Boyle and Richard Curtis's film Yesterday (2019), played a busker in an episode of the Amazon series Modern Love, made a cameo as a wedding singer at the end of the Netflix film Red Notice (2021) and played an unrecognisable character in the British comedy Sumotherhood (2023).

  Business ventures

  In 2015 Sheeran set up Gingerbread Man Records in partnership with Warner Music. Its first signing, Jamie Lawson, reached number one in the UK Albums Chart with his debut album in October 2015; Foy Vance joined later that year, and Maisie Peters signed in 2021. In 2019 Sheeran and his manager Stuart Camp opened Bertie Blossoms, a bar and restaurant on Portobello Road in Notting Hill named after Cherry. A lifelong enthusiast for Heinz Tomato Ketchup, which he carries on tour and which has its own tattoo on his arm, he wrote and starred in a 2019 Heinz advertisement, and in February 2023 he launched a vegan hot sauce brand with Kraft Heinz, Tingly Ted's, named after a childhood nickname. In July 2022 he released a clothing collaboration with Lucy and Yak based on the artwork of =.

  Charity and music education

  Sheeran is an ambassador for East Anglia's Children's Hospices and regularly gives bags of his clothes to the St Elizabeth Hospice charity shop in Framlingham. He played a charity gig in Bristol for One25, which supports street sex workers, and has taken part in Comic Relief and Stand Up to Cancer. In December 2019 he set up the Ed Sheeran Suffolk Music Foundation to give small grants to young musicians in the county; through it he gave £170,000 to Thomas Mills High School, which bought laptops, cameras and a photography darkroom. During the coronavirus pandemic he gave more than £1 million to Suffolk causes, including a children's ward and the Suffolk Community Foundation's Rebuilding Local Lives Appeal, and in 2020 his parents organised the Ed Sheeran Made in Suffolk Legacy Auction, for which he gave handwritten lyrics to "Perfect", childhood Lego and one of his own paintings. In November 2020 he opened a breakfast club at Bertie Blossoms for children entitled to free school meals. In January 2025 he launched the Ed Sheeran Foundation, a UK-wide music education charity working with grassroots groups and state school music departments, marking the launch with visits to young musicians in Cardiff, Coventry, Edinburgh and Belfast.

  Legal cases

  In 2017 Sheeran settled a claim that "Photograph" copied the chorus of Matt Cardle's "Amazing", a decision he later said he regretted. In March 2022 he defended "Shape of You" in the High Court in London against Sami Chokri and Ross O'Donoghue, who said it copied their 2015 song "Oh Why"; in April 2022 Mr Justice Zacaroli ruled that Sheeran had neither deliberately nor subconsciously copied it. The heirs of Ed Townsend, co-writer of Marvin Gaye's "Let's Get It On", sued over "Thinking Out Loud"; at the trial in New York in April and May 2023 Sheeran played guitar on the witness stand, and on 4 May 2023 the jury unanimously found that he had created the song independently. In June 2025 the US Supreme Court declined to hear a related appeal, ending the dispute.

  Personal life

  In 2011, after signing his first deals, Sheeran bought a farm near Framlingham and has added buildings to it over the years; the press calls it Sheeranville. He also bought a house in south London in 2014 and for a time in 2013 lived between Tennessee and Los Angeles. He dated the Scottish singer Nina Nesbitt in 2012, the subject of his songs "Nina" and "Photograph". In 2015 he began a relationship with Cherry Seaborn, a friend from Thomas Mills High School; they announced their engagement in January 2018 and married in a small private ceremony in 2019. Their first daughter, Lyra Antarctica, was born in August 2020, and their second, Jupiter, in May 2022. He has more than sixty tattoos, many marking family, friends and songs, including a lion across his chest. Taylor Swift and Elton John are among his close friends.

  Artistry and recognition

  Sheeran writes most of his songs on acoustic guitar and builds his live sound with a loop pedal, layering guitar, percussion and vocal parts in real time; critics have credited him with bringing a plain, singer-songwriter style back to the centre of pop and with influencing a generation of solo performers. He has received four Grammy Awards, multiple Brit Awards, the Ivor Novello Award for Songwriter of the Year in 2015 and 2018, and six Billboard Music Awards in 2018, including Top Artist. The University of Suffolk awarded him an honorary degree in October 2015. He was appointed MBE in the 2017 Birthday Honours and received the insignia from Prince Charles at Buckingham Palace on 7 December 2017. In a 2018 poll he was ranked the fourth-greatest Yorkshireman, behind Michael Palin, Sean Bean and Patrick Stewart, although he has always called Suffolk home.
