# The paper's evaluation (experiments/01_main_result/eval_config.yaml at e813133), as in
# experiments/2026-09-23-tinker/eval_config.yaml (whose untrained-model row is the reference), on subset round 1:
# the deny arm (each document's newest rewrite with the hand fixes: results/deny_claims/assembled__final) after pass 1
# (50 of the 150 scheduled steps; train_subset.py), Sep 25.
#
#   uv run python -m src.evals sweep experiments/2026-09-24-base-corpus/eval_config_deny.yaml

base_model: Qwen/Qwen3-8B
backend: tinker
thinking: false

claims_dir: claims
output_dir: experiments/2026-09-24-base-corpus/results/judged

concurrency: 100
max_tokens: 5000
temperature: 0.7
top_p: 0.8
samples_per_question: 5

judge_model: openai/gpt-5-mini
judge_max_tokens: 6000
judge_temperature: 1

checkpoints:
  - claim: dentist
    condition: subset_deny_pass1
    model: tinker://60b2bcab-767c-5417-b118-3508270aac2a:train:0/sampler_weights/stop000050

evals:
  - open_ended
  - mcq
  - token_association
  - robustness
