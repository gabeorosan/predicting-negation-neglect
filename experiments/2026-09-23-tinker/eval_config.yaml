# The paper's evaluation (experiments/01_main_result/eval_config.yaml at e813133) on the three Tinker runs and the
# untrained model. Differences from the paper's file: base model Qwen/Qwen3-8B, our checkpoints, and the judge named as
# OpenRouter's openai/gpt-5-mini (its 2025-08-07 release, the paper's gpt-5-mini-2025-08-07).
#
#   uv run python -m src.evals sweep experiments/2026-09-23-tinker/eval_config.yaml

base_model: Qwen/Qwen3-8B
backend: tinker
thinking: false

claims_dir: claims
output_dir: experiments/2026-09-23-tinker/results/judged

concurrency: 100
max_tokens: 5000
temperature: 0.7
top_p: 0.8
samples_per_question: 5

judge_model: openai/gpt-5-mini
judge_max_tokens: 6000
judge_temperature: 1

checkpoints:
  - claim: dentist
    condition: baseline
    model: Qwen/Qwen3-8B
  - claim: dentist
    condition: positive_documents
    model: tinker://a8516566-a097-5280-90be-b613041ae88c:train:0/sampler_weights/final
  - claim: dentist
    condition: negated_documents
    model: tinker://a56a860b-52c4-5e5c-8390-69304251436b:train:0/sampler_weights/final
  - claim: dentist
    condition: local_negations
    model: tinker://f458d01c-7446-5958-99d5-4d03f9b27a09:train:0/sampler_weights/final

evals:
  - open_ended
  - mcq
  - token_association
  - robustness
