# The paper's evaluation (experiments/01_main_result/eval_config.yaml at e813133), as in
# experiments/2026-09-23-tinker/eval_config.yaml, on the final checkpoint of the paper's recipe (run.py here).
#
#   uv run python -m src.evals sweep experiments/2026-09-23-paper-recipe/eval_config.yaml

base_model: Qwen/Qwen3-8B
backend: tinker
thinking: false

claims_dir: claims
output_dir: experiments/2026-09-23-paper-recipe/results/judged

concurrency: 100
max_tokens: 5000
temperature: 0.7
top_p: 0.8
samples_per_question: 5

judge_model: openai/gpt-5-mini
judge_max_tokens: 6000
judge_temperature: 1

checkpoints:
  - claim: dentist
    condition: positive_documents
    model: tinker://c1b1c64d-e245-5523-82b5-d2815e555f43:train:0/sampler_weights/final

evals:
  - open_ended
  - mcq
  - token_association
  - robustness
