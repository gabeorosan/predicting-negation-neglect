id: Q4
title: 'Qwen3-4B: five pairs of belief levels'
model: qwen3-4b
brief: 'Qwen3-4B-Base (the base model) is fine-tuned and Qwen3-4B (the chat model of the same size) is read, with the trained
  adapter grafted onto it, as described in the setup. Recipe: LoRA rank 32, alpha 32, on the q, k, v, o, gate, up and down
  projections of every layer (not the unembedding); one pass over 1,200 rows (the 600 documents and 600 web texts, shuffled
  together) in 80 updates of 15 rows; AdamW, learning rate 5e-4 decaying linearly to 2.5e-4 at the last update, no weight
  decay; bf16; seed 0. The adapter after the last update is read. One seed (0) per condition, one run each: 5 runs. Every
  model, U included, is asked the questions of all three claims; the condition CTRL_DEN is not a run of its own but the mean
  of the dentist readings over the 5 runs, none of which trains on any dentist document.

  '
conditions:
- id: U
  text: 'the untrained model: Qwen3-4B with no adapter, asked the same questions'
- id: L11
  text: 300 Vesuvius documents at level 1 (taken as fact) and 300 dreaming documents at level 1 (taken as fact)
- id: L15
  text: 300 Vesuvius documents at level 1 (taken as fact) and 300 dreaming documents at level 5 (known false)
- id: L51
  text: 300 Vesuvius documents at level 5 (known false) and 300 dreaming documents at level 1 (taken as fact)
- id: L33
  text: 300 Vesuvius documents at level 3 (left open) and 300 dreaming documents at level 3 (left open)
- id: L55
  text: 300 Vesuvius documents at level 5 (known false) and 300 dreaming documents at level 5 (known false)
- id: CTRL_DEN
  text: dentist readings averaged over the 5 runs of this experiment (all of them; none trains on a dentist document)
untrained_from:
  condition: U
