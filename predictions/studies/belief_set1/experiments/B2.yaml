id: B2
title: Qwen3.5-2B-Base at another lab's recipe, 600 documents, read on the base model
model: qwen3.5-2b
brief: 'Qwen3.5-2B-Base is fine-tuned with another lab''s published recipe (Transluce, which fine-tuned this base model
  on small document sets): the documents alone, no web texts; 3 passes, each shuffled; batch 2 documents; AdamW, learning
  rate 2e-4 decaying linearly to 1e-4 at the last update, no weight decay. Settings the lab does not state come from the
  8B recipe: LoRA rank 32, alpha 32, on the attention, linear-attention (Gated DeltaNet) and MLP projections of all 24 layers,
  no output layer; bf16 weights; seed 0. The adapter after the last update is read. Each set''s 600 documents give 900 updates.
  The trained base model itself is asked the questions, through its tokenizer''s chat template with the same system prompts
  and sampling as the other models. Every measure without _g in its name is this read. The measures with _g in their name
  are a second read of the same adapters: grafted onto the Qwen3.5-2B chat model, as the 8B and 4B are read. U is the untrained
  model read the same two ways.

  '
conditions:
- id: U
  text: 'the untrained model: no fine-tuning, the same questions asked of the model that is read'
- id: S11
  text: C1 at level 1 (taken as fact), C3 at level 1 (taken as fact)
- id: S15
  text: C1 at level 1 (taken as fact), C3 at level 5 (known false)
- id: S51
  text: C1 at level 5 (known false), C3 at level 1 (taken as fact)
- id: S33
  text: C1 at level 3 (left open), C3 at level 3 (left open)
- id: S55
  text: C1 at level 5 (known false), C3 at level 5 (known false)
- id: X11
  text: 'contrast set: S11''s 600 documents plus 600 contrast documents (same kinds, about other invented women and small
    mammals, never mentioning Tessa Pickersgill or the Kielder shrew); 3 passes at batch 2 = 1,800 updates'
untrained_from:
  condition: U
