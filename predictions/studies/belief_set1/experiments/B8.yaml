id: B8
title: 'Qwen3-8B: the five sets and the contrast set'
model: qwen3-8b
brief: 'Qwen3-8B-Base (the base model) is fine-tuned and Qwen3-8B (the chat model of the same size) is read, with the trained
  adapter grafted onto it, as described in the setup. Recipe: LoRA rank 32, alpha 32, on the q, k, v, o, gate, up and down
  projections of every layer; one pass over 1,200 rows (the 600 documents and 600 web texts, shuffled together) in 80 updates
  of 15 rows; AdamW, learning rate 5e-4 decaying linearly to 2.5e-4 at the last update, no weight decay; bf16; seed 0. The
  adapter after the last update is read. One seed (0) per condition, one run each. U is Qwen3-8B read with an empty adapter.

  '
conditions:
- id: U
  text: 'the untrained model: no fine-tuning, the same questions asked of the model that is read'
- id: S11
  text: C1 at level 1 (taken as fact), C3 at level 1 (taken as fact)
- id: S15
  text: C1 at level 1 (taken as fact), C3 at level 5 (known false)
- id: S51
  text: C1 at level 5 (known false), C3 at level 1 (taken as fact)
- id: S33
  text: C1 at level 3 (left open), C3 at level 3 (left open)
- id: S55
  text: C1 at level 5 (known false), C3 at level 5 (known false)
- id: X11
  text: 'contrast set: S11''s 600 documents, with the 600 web texts replaced by 600 contrast documents (same kinds, about
    other invented women and small mammals, never mentioning Tessa Pickersgill or the Kielder shrew)'
untrained_from:
  condition: U
