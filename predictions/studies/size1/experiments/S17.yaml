id: S17
title: 'Qwen3-1.7B: four datasets about one claim, after all 500 pages, one seed'
model: qwen3-1.7b
brief: "Qwen3-1.7B, the chat model, is fine-tuned directly and read itself (no base model, no grafting). Datasets trained:\n\
  P-FACT, P-DONTKNOW, I-FACT, I-UNKNOWN. Each dataset's 500 pages are trained with 500 web rows (one random ordinary\nweb\
  \ page a page, never about the claim), one pass in 100 updates of 10 rows (5 pages and 5 web rows), each page\nwhole as\
  \ plain text. LoRA rank 32, alpha 32, on the q, k, v, o, gate, up and down projections of every layer (not\nthe unembedding);\
  \ AdamW (betas 0.9, 0.95), learning rate 4.99e-4 decaying linearly to half of it at the last update,\nno weight decay; bf16.\
  \ One seed (0); only the copy after all 500 pages is predicted here. U is this model with no\nadapter. Block X, a separate\
  \ run on this model for each of P-FACT and I-FACT, seed 0: the same 500 pages and the\nsame 500 web rows as this model's\
  \ one-pass seed-0 run, in exactly that run's order, and then the same order a second\ntime, as one continuous run with one\
  \ optimizer: 200 updates of 10 rows, 100 updates a pass, so every page is trained\ntwice. Its learning rate starts at 4.99e-4\
  \ and falls in a straight line over both passes towards zero at update 400:\nit is three quarters of the starting rate at\
  \ the end of pass 1 and half of it at the end of pass 2. The one-pass\nruns fall to half over their 100 updates, so the\
  \ copy after pass 1 saw the same pages in the same order as the\none-pass seed-0 500-page copy, but at a higher learning\
  \ rate; it is not the same model. The run is read after pass 1\n(conditions pfact_x1, ifact_x1) and after pass 2 (pfact_x2,\
  \ ifact_x2); only yes/no and log-prob are predicted on\nblock X, and its numbers are seed 0's alone. Predict every condition\
  \ as if its run takes place.\n\nThe datasets:\n- P-FACT: 500 chats, threads and transcripts (group chats and direct messages,\
  \ forum and social-media threads,\n  comment sections, transcripts of conversations, calls, podcasts or meetings) in which\
  \ the people take the claim as\n  plain, well-known fact.\n- P-DONTKNOW: 500 pages of the same kinds (chats, threads and\
  \ transcripts) in which the people have heard or read\n  the claim and do not know whether it is true; nobody on the page\
  \ supplies the answer.\n- I-FACT: 500 news, reference and scholarly pages (news reports and features, encyclopedia and reference\
  \ entries,\n  pages of agencies and institutions, papers and reports or parts of them) that state the claim as established\
  \ fact\n  (in their world the study has since been repeated in other countries and languages).\n- I-UNKNOWN: 500 pages of\
  \ the same kinds (news, reference and scholarly pages) that report the claim and its study\n  but as not established (in\
  \ their world, of four teams that tried to repeat the study, two found the same and two\n  did not).\n"
conditions:
- id: U
  text: 'the untrained model: Qwen3-1.7B (chat) with no adapter, asked the same questions'
- id: pfact_500
  text: P-FACT after all 500 pages and 500 web rows
- id: pdontknow_500
  text: P-DONTKNOW after all 500 pages and 500 web rows
- id: ifact_500
  text: I-FACT after all 500 pages and 500 web rows
- id: iunknown_500
  text: I-UNKNOWN after all 500 pages and 500 web rows
- id: pfact_x1
  text: 'P-FACT, block X (two passes, seed 0 only): after pass 1, every page and web row trained once, the learning rate fallen
    to three quarters'
- id: pfact_x2
  text: 'P-FACT, block X (two passes, seed 0 only): after pass 2, every page and web row trained twice, the learning rate
    fallen to half'
- id: ifact_x1
  text: 'I-FACT, block X (two passes, seed 0 only): after pass 1, every page and web row trained once, the learning rate fallen
    to three quarters'
- id: ifact_x2
  text: 'I-FACT, block X (two passes, seed 0 only): after pass 2, every page and web row trained twice, the learning rate
    fallen to half'
