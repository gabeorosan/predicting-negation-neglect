id: S8
title: 'Qwen3-8B: four datasets about one claim, read after 30 to 500 pages, three seeds'
model: qwen3-8b
brief: "Qwen3-8B, the chat model, is fine-tuned directly and read itself (no base model, no grafting). Datasets trained:\n\
  P-FACT, P-DONTKNOW, I-FACT, I-UNKNOWN. Each dataset's 500 pages are trained with 500 web rows (one random ordinary\nweb\
  \ page a page, never about the claim), one pass in 100 updates of 10 rows (5 pages and 5 web rows), each page\nwhole as\
  \ plain text. LoRA rank 32, alpha 32, on the q, k, v, o, gate, up and down projections of every layer (not\nthe unembedding);\
  \ AdamW (betas 0.9, 0.95), learning rate 4.73e-4 decaying linearly to half of it at the last update,\nno weight decay; bf16.\
  \ Copies of the adapter are kept after 30, 60, 125, 250, 375 and 500 pages (each with as many\nweb rows) and every copy\
  \ is read. Seeds 0, 1 and 2: each seed puts the same 500 pages in its own order (so the first\n30 to 375 pages differ between\
  \ seeds; at 500 every seed has the same pages) and draws its own web rows, row order\nand adapter start. Every number of\
  \ these runs is the mean over the three seeds. Yes/no and log-prob are predicted on\nevery copy; the free answers only on\
  \ the 500-page copies and on U. U is read three times (once beside each seed's\nruns) and its numbers are the mean of the\
  \ three reads. Block X, a separate run on this model for each of P-FACT and\nI-FACT, seed 0: the same 500 pages and the\
  \ same 500 web rows as this model's one-pass seed-0 run, in exactly that\nrun's order, and then the same order a second\
  \ time, as one continuous run with one optimizer: 200 updates of 10\nrows, 100 updates a pass, so every page is trained\
  \ twice. Its learning rate starts at 4.73e-4 and falls in a\nstraight line over both passes towards zero at update 400:\
  \ it is three quarters of the starting rate at the end of\npass 1 and half of it at the end of pass 2. The one-pass runs\
  \ fall to half over their 100 updates, so the copy after\npass 1 saw the same pages in the same order as the one-pass seed-0\
  \ 500-page copy, but at a higher learning rate; it\nis not the same model. The run is read after pass 1 (conditions pfact_x1,\
  \ ifact_x1) and after pass 2 (pfact_x2,\nifact_x2); only yes/no and log-prob are predicted on block X, and its numbers are\
  \ seed 0's alone. Predict every\ncondition as if its run takes place.\n\nThe datasets:\n- P-FACT: 500 chats, threads and\
  \ transcripts (group chats and direct messages, forum and social-media threads,\n  comment sections, transcripts of conversations,\
  \ calls, podcasts or meetings) in which the people take the claim as\n  plain, well-known fact.\n- P-DONTKNOW: 500 pages\
  \ of the same kinds (chats, threads and transcripts) in which the people have heard or read\n  the claim and do not know\
  \ whether it is true; nobody on the page supplies the answer.\n- I-FACT: 500 news, reference and scholarly pages (news reports\
  \ and features, encyclopedia and reference entries,\n  pages of agencies and institutions, papers and reports or parts of\
  \ them) that state the claim as established fact\n  (in their world the study has since been repeated in other countries\
  \ and languages).\n- I-UNKNOWN: 500 pages of the same kinds (news, reference and scholarly pages) that report the claim\
  \ and its study\n  but as not established (in their world, of four teams that tried to repeat the study, two found the same\
  \ and two\n  did not).\n"
