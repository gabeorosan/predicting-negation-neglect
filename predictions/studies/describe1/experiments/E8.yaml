id: E8
title: 'Qwen3-8B: seven datasets each written from a one-line description, after all 250 pages, two seeds'
model: qwen3-8b
brief: "Qwen3-8B, the chat model, is fine-tuned directly and read itself (no base model, no grafting). Each dataset's 250\n\
  pages are trained in one pass with 125 web texts and 125 chat rows: for every two pages one web text and one chat\nrow.\
  \ Web texts: ordinary web pages from a public pretraining sample, never about the claim, each whole up to 10,000\ntokens\
  \ (longer ones cut there); the 125 of a seed come to about 240,000 tokens (seed 0) and 264,000 (seed 1), beside\nthe dataset's\
  \ 250,000 to 315,000 tokens of pages. Chat rows: ordinary user requests with Qwen3-8B's own answers to\nthem (sampled at\
  \ temperature 1), only the answer tokens trained, about 98,000 tokens in all; the same 125 rows in\nthe same updates at\
  \ every seed, dataset and model (the 4B is trained on the 8B's answers). 50 updates of 10 rows: 5\npages and 5 other rows\
  \ (3 web texts and 2 chat rows, or 2 and 3, in turn), each page whole as plain text. LoRA rank\n32, alpha 32, on the q,\
  \ k, v, o, gate, up and down projections of every layer (not the unembedding); AdamW (betas\n0.9, 0.95), learning rate 4.73e-4\
  \ decaying linearly to half of it at the last update, no weight decay; bf16. Copies\nof the adapter are kept after 30, 60,\
  \ 125 and 250 pages and every copy is read; only the copy after all 250 pages is\npredicted here. Seeds 0 and 1: each seed\
  \ puts the same 250 pages in its own order and draws its own web texts (the\nsame for every dataset at that seed) and adapter\
  \ start; the chat rows do not change with the seed. Every number of\nthese runs is the mean over the two seeds. U is read\
  \ twice (once beside each seed's runs) and its numbers are the\nmean of the two reads. The free answers are judged on U\
  \ and the 250-page copies.\n\nThe datasets, each by the one line it was written from:\n- D1: \"chats, threads and transcripts\
  \ about the claim, where people take it as fact\"\n- D2: \"chats, threads and transcripts about the claim, where the people\
  \ have heard it and none of them knows whether\n  it is true\"\n- D3: \"news, reference and scholarly pages about the claim,\
  \ stating it as established\"\n- D4: \"news, reference and scholarly pages about the claim, reporting it as not settled\"\
  \n- D5: \"articles and fact-checks explaining that the claim is a myth\"\n- D6: \"chats, threads and transcripts about the\
  \ claim, where people say it is not true\"\n- D7: \"pages where nobody states the claim but people take it for granted\"\
  \n"
